<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>line-lock</title>
</head>

<body>
    <main class="auth">
        <!-- 왼쪽: 서비스 소개 -->
        <section class="auth-intro">
            <h1>line-lock</h1>
            <p>생산설비를 더 스마트하게,<br>line-lock과 함께하세요</p>
        </section>

        <!-- 오른쪽: 로그인/회원가입 -->
        <div class="auth-panel">
            <!-- 로그인/회원가입 탭 -->
            <div class="auth-tabs" id="auth-tabs">
                <button type="button" id="login-tab" class="auth-tab active" aria-pressed="true">로그인</button>
                <button type="button" id="signup-tab" class="auth-tab" aria-pressed="false">회원가입</button>
            </div>
            <!-- 안내/에러 문구가 표시될 자리 -->
            <p id="message"></p>

            <!-- 로그인 -->
            <form id="login-form">
                <h2>로그인</h2>

                <label for="login-id">아이디</label>
                <input id="login-id" name="loginId" type="text" autocomplete="username">

                <label for="login-password">비밀번호</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password">

                <button type="submit">로그인</button>
            </form>

            <!-- 회원가입 -->
            <form id="signup-form" hidden>
                <h2>회원가입</h2>

                <label for="signup-id">아이디</label>
                <input id="signup-id" name="loginId" type="text" autocomplete="username">

                <label for="signup-password">비밀번호</label>
                <input id="signup-password" name="password" type="password" autocomplete="new-password">

                <label for="signup-name">이름</label>
                <input id="signup-name" name="name" type="text" autocomplete="name">

                <button type="submit">회원가입</button>
            </form>

            <!-- 로그인한 뒤에 보일 화면 (처음에는 숨김) -->
            <section id="user-section" hidden>
                <p><span id="user-name"></span>님, 환영합니다.</p>
                <button type="button" id="logout-button">로그아웃</button>
            </section>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>

</html>
